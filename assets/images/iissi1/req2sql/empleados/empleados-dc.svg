ext fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="78.041" x="352.5" y="110.751">fechaFin: Date</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="80.0449" x="352.5" y="124.5498">salario: Double</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="92.0449" x="352.5" y="138.3486">comisi&#243;n: Double</text></g><g id="elem_GMN6"><path d="M66.5,232.0986 L66.5,262.7969 A0,0 0 0 0 66.5,262.7969 L314.1348,262.7969 A0,0 0 0 0 314.1348,262.7969 L314.1348,251.5986 L349.79,247.5986 L314.1348,243.5986 L314.1348,242.0986 L304.1348,232.0986 L66.5,232.0986 A0,0 0 0 0 66.5,232.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M304.1348,232.0986 L304.1348,242.0986 L314.1348,242.0986 L304.1348,232.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="226.6348" x="72.5" y="245.5405">- La combinaci&#243;n nombre y localidad no se puede repetir</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="224.1431" x="72.5" y="255.8896">- Un departamento no puede tener m&#225;s de 5 empleados</text></g><g id="elem_GMN9"><path d="M6,69.0986 L6,120.4951 A0,0 0 0 0 6,120.4951 L310.6802,120.4951 A0,0 0 0 0 310.6802,120.4951 L310.6802,98.5986 L346.39,94.5986 L310.6802,90.5986 L310.6802,79.0986 L300.6802,69.0986 L6,69.0986 A0,0 0 0 0 6,69.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M300.6802,69.0986 L300.6802,79.0986 L310.6802,79.0986 L300.6802,69.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="170.6089" x="12" y="82.5405">- Un empleado no puede ser su propio jefe</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="221.1284" x="12" y="92.8896">- La comisi&#243;n es un porcentaje del salario entre 0 y 100</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="176.0977" x="12" y="103.2388">- Los nombres de los empleados son &#250;nicos</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="283.6802" x="12" y="113.5879">- La fecha de inicio del contrato no puede ser posterior a la fecha de fin</text></g><!--link Empleado to Departamento--><g id="link_Empleado_Departamento"><path codeLine="17" d="M398.5,145.4586 C398.5,169.5086 398.5,197.5086 398.5,217.9386 " fill="none" id="Empleado-Departamento" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#0000FF" points="402.5,185.8481,404.8511,178.6121,400.1489,178.6121,402.5,185.8481" style="stroke:#0000FF;stroke-width:1.0;"/><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="42.8076" x="409.5" y="185.4785">trabajaEn</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="5.5615" x="393.2128" y="162.1049">1</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="15.0098" x="381.6264" y="207.7608">0..*</text></g><!--link Empleado to Empleado--><g id="link_Empleado_Empleado"><path codeLine="18" d="M450.74,78.4986 C469.85,78.0586 485.5,83.4286 485.5,94.5986 C485.5,105.7686 469.85,111.1386 450.74,110.6986 " fill="none" id="Empleado-Empleado" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#0000FF" points="489.4079,98.8471,491.925,91.6671,487.224,91.5588,489.4079,98.8471" style="stroke:#0000FF;stroke-width:1.0;"/><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="40.5859" x="501.5" y="98.4785">tieneJefe</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="38.3594" x="458.5491" y="74.5546">Jefe 0..1</text><text fill="#0000FF" font-family="Arial" font-size="10" len
io</text><line style="stroke:#000000;stroke-width:0.5;" x1="357.5" x2="451.5586" y1="81.6963" y2="81.6963"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="78.7031" x="362.5" y="96.9521">nombre: String</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="84.0586" x="362.5" y="110.751">genero: Genero</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="70.7227" x="362.5" y="124.5498">edad: Integer</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="66.6914" x="362.5" y="138.3486">email: String</text></g><g id="elem_rn"><path d="M164,79.0986 L164,109.7969 L320.5669,109.7969 L320.5669,89.0986 L310.5669,79.0986 L164,79.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M310.5669,79.0986 L310.5669,89.0986 L320.5669,89.0986 L310.5669,79.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="135.5669" x="170" y="92.5405">RN01: Usuarios mayores de edad</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="122.0581" x="170" y="102.8896">RN02: Email &#250;nico por usuario</text></g><g id="elem_ra"><path d="M6,206.0986 L6,288.5425 L168.5874,288.5425 L168.5874,216.0986 L158.5874,206.0986 L6,206.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M158.5874,206.0986 L158.5874,216.0986 L168.5874,216.0986 L158.5874,206.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="92.0522" x="12" y="219.5405">Requisitos adicionales:</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="120.5859" x="22.002" y="229.8896">RA01: La edad del tutor deber</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="117.0659" x="22.002" y="240.2388">ser mayor que la del tutorado</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="131.5854" x="22.002" y="250.5879">RA02: Un usuario tutor no puede</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="109.5557" x="22.002" y="260.937">tutorar a m&#225;s de 3 usuarios</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="131.5854" x="22.002" y="271.2861">RA03: Un usuario tutor no puede</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="110.5664" x="22.002" y="281.6353">ser tutorado de otro usuario</text></g><!--link Usuario to Usuario--><g id="link_Usuario_Usuario"><path codeLine="49" d="M452.68,79.6686 C471.65,78.9186 487.5,83.8986 487.5,94.5986 C487.5,105.2986 471.65,110.2786 452.68,109.5286 " fill="none" id="Usuario-Usuario" style="stroke:#000000;stroke-width:1.0;"/><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="32.2412" x="493.5" y="98.4785">tutoraA</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="16.6797" x="460.624" y="75.2252">0..1</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="15.0098" x="460.5066" y="109.2843">0..*</text></g><!--SRC=[ZPBDQi9058NtFiLjDeM2KUikY10aBO96qFe0LtCh0vEPEZ-BKdoOlaQtlbZd9uaHkcWMOUREkL_EkHC00CCC9qZssg9YKcTWh96AT39mX_30n97RYY1DHwGDurAFtfb0dZ9Ryq7G5CBMy4g2b8JPB6n9OILXFeUleF3FEjyjzgjbkUagByMwAFk5pTisRYuHlE2eDJJE8jgm2gjxi93rGL46EwEOE7NbKp2KDSQwChd-39R2q8dKhLeZutU8ItYNqX2W1YKwwROSJxBMb8OQF_sqm8t8e_kovmmApuNhZs172HzIWOrzpTogy84OzZ7NyiZmoAGW7IfjS4Z6QJf9O3WCgwUaFMdk2lCW7zmxnh3TqjaopOnpYXNpSEIaivlDtATPOJ3lGl28TAj3RpoQL0mAPql0yIPqrzndkSXxqOPiKC8bjrHHfukD2X3gwtUOtBHjqNtOz3ymRwrrub7IkB_mxod_0W00]--></g></svg>
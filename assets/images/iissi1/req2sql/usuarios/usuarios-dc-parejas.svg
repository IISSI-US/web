<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="326px" preserveAspectRatio="none" style="width:580px;height:326px;background:#FFFFFF;" version="1.1" viewBox="0 0 580 326" width="580px" zoomAndPan="magnify"><title>Usuarios: parejas</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="117.4961" x="224.2974" y="23.1318">Usuarios: parejas</text><!--class Genero--><g id="elem_Genero"><rect codeLine="69" fill="#F5FFFA" height="86.9941" id="Genero" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="83.3438" x="69" y="51.0986"/><text fill="#000000" font-family="Arial" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="75.3867" x="72.9785" y="67.3545">&#171;Enumerado&#187;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="40.0254" x="90.6592" y="81.1533">Genero</text><line style="stroke:#000000;stroke-width:0.5;" x1="70" x2="151.3438" y1="88.6963" y2="88.6963"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="71.3438" x="75" y="103.9521">MASCULINO</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="63.334" x="75" y="117.751">FEMENINO</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="34.6641" x="75" y="131.5498">OTRO</text></g><!--class Usuario--><g id="elem_Usuario"><rect codeLine="75" fill="#F5FFFA" height="100.793" id="Usuario" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="96.0586" x="379.5" y="44.0986"/><text fill="#000000" font-family="Arial" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="54.0469" x="400.5059" y="60.3545">&#171;Entidad&#187;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="41.3496" x="406.8545" y="74.1533">Usuario</text><line style="stroke:#000000;stroke-width:0.5;" x1="380.5" x2="474.5586" y1="81.6963" y2="81.6963"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="78.7031" x="385.5" y="96.9521">nombre: String</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="84.0586" x="385.5" y="110.751">genero: Genero</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="70.7227" x="385.5" y="124.5498">edad: Integer</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="66.6914" x="385.5" y="138.3486">email: String</text></g><g id="elem_rn"><path d="M187,79.0986 L187,109.7969 L343.5669,109.7969 L343.5669,89.0986 L333.5669,79.0986 L187,79.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M333.5669,79.0986 L333.5669,89.0986 L343.5669,89.0986 L333.5669,79.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="135.5669" x="193" y="92.5405">RN01: Usuarios mayores de edad</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="122.0581" x="193" y="102.8896">RN02: Email &#250;nico por usuario</text></g><g id="elem_ra"><path d="M6,206.0986 L6,319.5898 L214.6113,319.5898 L214.6113,216.0986 L204.6113,206.0986 L6,206.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M204.6113,206.0986 L204.6113,216.0986 L214.6113,216.0986 L204.6113,206.0986 " fill="#FFD700" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="92.0522" x="12" y="219.5405">Requisitos adicionales:</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="137.0962" x="22.002" y="229.8896">RA01: La diferencia de edad entre</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="177.6094" x="22.002" y="240.2388">los usuarios no puede ser mayor de 15 a&#241;os</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="111.0762" x="22.002" y="250.5879">RA02: Un usuario no puede</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="112.5527" x="22.002" y="260.937">hacer pareja consigo mismo</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="135.0703" x="22.002" y="271.2861">RA03: No se permiten parejas del</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="122.0669" x="22.002" y="281.6353">mismo g&#233;nero si alguno de los</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="101.5664" x="22.002" y="291.9844">dos es menor de 21 a&#241;os</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="111.0762" x="22.002" y="302.3335">RA04: Un usuario no puede</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="142.5762" x="22.002" y="312.6826">tener m&#225;s de 2 parejas simult&#225;neas</text></g><!--link Usuario to Usuario--><g id="link_Usuario_Usuario"><path codeLine="87" d="M475.68,79.6686 C494.65,78.9186 510.5,83.8986 510.5,94.5986 C510.5,105.2986 494.65,110.2786 475.68,109.5286 " fill="none" id="Usuario-Usuario" style="stroke:#000000;stroke-width:1.0;"/><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="50.5908" x="516.5" y="98.4785">hacePareja</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="3.8916" x="483.6641" y="74.8487">*</text><text fill="#0000FF" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="3.8916" x="483.6641" y="109.4677">*</text></g><!--SRC=[VL9DJzj04BtpArvpGQf4QDBsOY6a20M41A4ApG_OseEP
-size="9" lengthAdjust="spacing" textLength="184.856" x="542" y="269.291">Generalizaci&#243;n Ingreso = {Completa, Disjunta}</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="114.5786" x="542" y="279.6401">- Si Ingreso es Abandono =&gt;</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="211.5923" x="552.002" y="289.9893">lugarHallazgo y fechaHoraHallazgo OBLIGATORIOS</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="105.0601" x="542" y="300.3384">- Si Ingreso es Entrega =&gt;</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="214.5894" x="552.002" y="310.6875">Persona OBLIGATORIA con nombre, direccion, email</text></g><g id="elem_N2"><path d="M384.5,128.5 L384.5,169.5474 A0,0 0 0 0 384.5,169.5474 L447.9,169.5474 L359.04,244.8 L455.9,169.5474 L567.8296,169.5474 A0,0 0 0 0 567.8296,169.5474 L567.8296,138.5 L557.8296,128.5 L384.5,128.5 A0,0 0 0 0 384.5,128.5 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M557.8296,128.5 L557.8296,138.5 L567.8296,138.5 L557.8296,128.5 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="45.0308" x="390.5" y="141.9419">[Integridad]</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="97.8003" x="390.5" y="152.291">Si Animal.raza != null =&gt;</text><text fill="#000000" font-family="Arial" font-size="9" lengthAdjust="spacing" textLength="152.3276" x="400.502" y="162.6401">Animal.especie = Animal.raza.especie</text></g><g id="elem_N3"><path d="M6,261 L6,302.0474 L221.6118,302.0474 L221.6118,271 L211.6118,261 L6,261 " fill="#FFD700" style="stroke:#000000;stroke-width:0.5;"/><path d="M211.6118,261 L211.6118,271 L221.6118,271 L211.6118,261 " fill="#FFD700" style="stroke:#000000;stroke-width:1.0;"/><text fil
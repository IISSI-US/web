<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="486px" preserveAspectRatio="none" style="width:780px;height:486px;" version="1.1" viewBox="0 0 780 486" width="780px" zoomAndPan="magnify"><defs/><g><text fill="#9F1732" font-family="Arial" font-size="28" font-weight="bold" lengthAdjust="spacing" textLength="378" x="187" y="46.2637">Notaci&#243;n para clases UML I</text><!--class NombreClase--><g id="elem_NombreClase"><rect codeLine="0" fill="#F5F3EA" height="201.5859" id="NombreClase" rx="5" ry="5" style="stroke:#9F1732;stroke-width:1.0;" width="194" x="470" y="272.1973"/><text fill="#6D6D6D" font-family="Arial" font-size="24" font-style="italic" lengthAdjust="spacing" textLength="112" x="511" y="304.709">&#171;Entidad&#187;</text><text fill="#222222" font-family="Arial" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="154" x="490" y="332.3066">NombreClase</text><line style="stroke:#9F1732;stroke-width:1.0;" x1="472" x2="662" y1="347.3926" y2="347.3926"/><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="170" x="482" y="377.9043">atributo1: Tipo1</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="170" x="482" y="405.502">atributo2: Tipo2</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="18" x="482" y="433.0996">...</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="170" x="482" y="460.6973">atributoN: tipoN</text></g><g id="elem_GMN3"><path d="M368,86.1973 L368,152.1934 L766,152.1934 L766,106.1973 L746,86.1973 L368,86.1973 " fill="#DFF1FF" style="stroke:#9F1732;stroke-width:1.0;"/><path d="M746,86.1973 L746,106.1973 L766,106.1973 L746,86.1973 " fill="#DFF1FF" style="stroke:#9F1732;stroke-width:2.0;"/><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="330" x="380" y="114.957">La zona del nombre es obligatoria.</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="356" x="380" y="137.9551">El estereotipo &#171;Entidad&#187; es opcional.</text></g><g id="elem_GMN6"><path d="M12,329.1973 L12,418.1914 L310,418.1914 L310,349.1973 L290,329.1973 L12,329.1973 " fill="#DFF1FF" style="stroke:#9F1732;stroke-width:1.0;"/><path d="M290,329.1973 L290,349.1973 L310,349.1973 L290,329.1973 " fill="#DFF1FF" style="stroke:#9F1732;stroke-width:2.0;"/><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="250" x="24" y="357.957">La zona de los atributos es</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="242" x="24" y="380.9551">opcional, se puede omitir</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="234" x="24" y="403.9531">si se considera oportuno.</text></g><!--link GMN3 to NombreClase--><g id="link_GMN3_NombreClase"><path d="M567,152.3973 C567,182.7973 567,229.3773 567,271.9373 " fill="none" id="GMN3-NombreClase" style="stroke:#8C0000;stroke-width:2.0;stroke-dasharray:7.0,7.0;"/></g><!--link GMN6 to NombreClase--><g id="link_GMN6_NombreClase"><path d="M310.44,374.1973 C363.58,374.1973 421.98,374.1973 469.64,374.1973 " fill="none" id="GMN6-NombreClase" style="stroke:#8C0000;stroke-width:2.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[TP11QWCn34NtFiNllamk4B8fMHJIx7e0ZQq4WSOojhp9jNA4NAoUeQNP1BJu_2_z1t9nPPpDAShZdb6e4g9IuuRlhnC-mvlag3qnfcatflH5TyvMXIOP-Zy_sp9N_bXljmGXP7E6Mu5TdkDm8jmi4n8hykPZy6nMkP9lrU6emtAkR2x5iDyViqkYT3XigoNAAD0fS4vOCRymvOk_fa6jWRpAt7seKHJ-cjxH6ANpMB95N2f2azMBbfia7c-nOjLxjYVe3m00]--></g></svg>
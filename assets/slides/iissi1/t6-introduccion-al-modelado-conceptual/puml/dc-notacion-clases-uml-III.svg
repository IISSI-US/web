<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1112px;height:574px;" width="1112px" height="574px" viewBox="0 0 1112 574" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="314"><text x="309.406" y="46.264" fill="#9F1732" font-size="28" textLength="479.24" font-weight="700" font-family="Arial">Notación para asociaciones en UML</text></g><!--class ClaseA--><g class="entity" data-qualified-name="ClaseA" id="ent0001" data-source-line="317"><rect x="480" y="152.197" width="100.043" height="47.598" fill="#F5F3EA" style="stroke:#9F1732;stroke-width:1;" rx="5" ry="5"/><text x="486" y="184.709" fill="#222" font-size="24" textLength="88.043" font-weight="700" font-family="Arial">Clase A</text></g><!--class ClaseB--><g class="entity" data-qualified-name="ClaseB" id="ent0002" data-source-line="318"><rect x="480" y="441.197" width="100.043" height="47.598" fill="#F5F3EA" style="stroke:#9F1732;stroke-width:1;" rx="5" ry="5"/><text x="486" y="473.709" fill="#222" font-size="24" textLength="88.043" font-weight="700" font-family="Arial">Clase B</text></g><g class="entity" data-qualified-name="NotaRol" id="ent0004" data-source-line="323"><path d="M12,86.197 L12,267.184 L319.713,267.184 L319.713,106.197 L299.713,86.197 L12,86.197" style="stroke:#9F1732;stroke-width:1;" fill="#DFF1FF"/><path d="M299.713,86.197 L299.713,106.197 L319.713,106.197 L299.713,86.197" style="stroke:#9F1732;stroke-width:2;" fill="#DFF1FF"/><text x="24" y="114.957" fill="#222" font-size="20" textLength="135.576" font-weight="700" font-family="Arial">Nombre de rol</text><text x="24" y="137.955" fill="#222" font-size="20" textLength="222.402" font-family="Arial">Indica el papel que juega</text><text x="24" y="160.953" fill="#222" font-size="20" textLength="265.713" font-family="Arial">cada clase. Solo es necesario</text><text x="24" y="183.951" fill="#222" font-size="20" textLength="250.137" font-family="Arial">en asociaciones reflexivas o</text><text x="24" y="206.949" fill="#222" font-size="20" textLength="193.447" font-family="Arial">cuando existen varias</text><text x="24" y="229.947" fill="#222" font-size="20" textLength="197.891" font-family="Arial">asociaciones entre las</text><text x="24" y="252.945" fill="#222" font-size="20" textLength="136.689" font-family="Arial">mismas clases.</text></g><g class="entity" data-qualified-name="NotaAsociacion" id="ent0005" data-source-line="333"><path d="M741,97.197 L741,255.186 L1082.053,255.186 L1082.053,117.197 L1062.053,97.197 L741,97.197" style="stroke:#9F1732;stroke-width:1;" fill="#DFF1FF"/><path d="M1062.053,97.197 L1062.053,117.197 L1082.053,117.197 L1062.053,97.197" style="stroke:#9F1732;stroke-width:2;" fill="#DFF1FF"/><text x="753" y="125.957" fill="#222" font-size="20" textLength="235.635" font-weight="700" font-family="Arial">Nombre de la asociación</text><text x="753" y="148.955" fill="#222" font-size="20" textLength="241.27" font-family="Arial">Es opcional y debe ser una</text><text x="753" y="171.953" fill="#222" font-size="20" textLength="293.496" font-family="Arial">forma verbal. Se lee de izquierda</text><text x="753" y="194.951" fill="#222" font-size="20" textLength="276.855" font-family="Arial">a derecha y de arriba abajo; en</text><text x="753" y="217.949" fill="#222" font-size="20" textLength="279.033" font-family="Arial">otro caso, se indica la dirección</text><text x="753" y="240.947" fill="#222" font-size="20" textLength="93.389" font-family="Arial">de lectura.</text></g><g class="entity" data-qualified-name="NotaMultiplicidad" id="ent0006" data-source-line="342"><path d="M18,398.197 L18,533.188 L317.861,533.188 L317.861,418.197 L297.861,398.197 L18,398.197" style="stroke:#9F1732;stroke-width:1;" fill="#DFF1FF"/><path d="M297.861,398.197 L297.861,418.197 L317.861,418.197 L297.861,398.197" style="stroke:#9F1732;stroke-width:2;" fill="#DFF1FF"/><text x="30" y="426.957" fill="#222" font-size="20" textLength="122.217" font-weight="700" font-family="Arial">Multiplicidad</text><text x="30" y="449.955" fill="#222" font-size="20" textLength="257.861" font-family="Arial">Indica el mínimo y el máximo</text><text x="30" y="472.953" fill="#222" font-size="20" textLength="241.26" font-family="Arial">de instancias relacionadas.</text><text x="30" y="495.951" fill="#222" font-size="20" textLength="206.816" font-family="Arial">Se puede indicar orden</text><text x="30" y="518.949" fill="#222" font-size="20" textLength="175.684" font-family="Arial">mediante {ordered}.</text></g><g class="entity" data-qualified-name="NotaValores" id="ent0007" data-source-line="350"><path d="M740,386.197 L740,544.186 L1079.988,544.186 L1079.988,406.197 L1059.988,386.197 L740,386.197" style="stroke:#9F1732;stroke-width:1;" fill="#DFF1FF"/><path d="M1059.988,386.197 L1059.988,406.197 L1079.988,406.197 L1059.988,386.197" style="stroke:#9F1732;stroke-width:2;" fill="#DFF1FF"/><text x="752" y="414.957" fill="#222" font-size="20" textLength="176.738" font-weight="700" font-family="Arial">Valores habituales</text><text x="752" y="437.955" fill="#222" font-size="20" textLength="118.975" font-family="Arial">0..1  opcional</text><text x="752" y="460.953" fill="#222" font-size="20" textLength="136.758" font-family="Arial">1..1  obligatoria</text><text x="752" y="483.951" fill="#222" font-size="20" textLength="190.107" font-family="Arial">0..*  múltiple opcional</text><text x="752" y="506.949" fill="#222" font-size="20" textLength="207.891" font-family="Arial">1..*  múltiple obligatoria</text><text x="752" y="529.947" fill="#222" font-size="20" font-weight="700" font-family="Arial">*</text><text x="765.34" y="529.947" fill="#222" font-size="20" textLength="284.648" font-family="Arial">equivale a 0..*; 1 equivale a 1..1</text></g><!--link ClaseA to ClaseB--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="320" data-link-type="association"><path d="M530,200.837 C530,255.437 530,386.077 530,440.617" style="stroke:#8C0000;stroke-width:2;" fill="none" id="ClaseA-ClaseB" codeLine="320"/><polygon points="368,316.236,372.702,301.764,363.298,301.764,368,316.236" fill="#222" style="stroke:#222;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382" y="315.497" fill="#222" font-size="20" textLength="146.758" font-family="Arial">seRelacionaCon</text><text x="489.349" y="234.846" fill="#222" font-size="20" textLength="30.02" font-family="Arial">0..*</text><text x="483.797" y="257.844" fill="#222" font-size="20" textLength="41.123" font-family="Arial">rol A</text><text x="482.581" y="398.076" fill="#222" font-size="20" textLength="41.123" font-family="Arial">rol B</text><text x="497.581" y="421.074" fill="#222" font-size="20" font-family="Arial">1</text></g><!--link NotaRol to ClaseA--><!--link ClaseA to NotaAsociacion--><!--link NotaMultiplicidad to ClaseB--><!--link ClaseB to NotaValores--><!--link NotaRol to NotaMultiplicidad--><!--link NotaAsociacion to NotaValores--><?plantuml-src TLDDRzD04BtxLmmvHiGbLrfLIYeEIBI78hXG3cFlj9bglPlkhaC0yMFu0PouSUqVuwtjj7MQIf6pEv_llTb9cgpGXKzSw_rVHsiEJ1nzhJ1u9v74qQVp3yKhTRLjZL1P7k6tRXjxbCG7vL9nBehQSemqESEVq6A28jIT5sFFyj6pB8e-WYPlod9wvOAtENCseqa-Bg_SV3A4qbkASYcsGyLdtj5fKJYV95VBy2-zBOXEgjCBtrH124XHu-IeEeNvlJDQCua5lpM-TwtGRIitJ73MR9WoHYdfexUUGDf9BP63UlWXm4YG8DTMjhf1Oz_bj-mCihOQ4s8tI8CBZZqP4r3PtjDeR73gciQo46SeSnapMZoaxnEpZoF2p0QExm1dtQbZwJkYAe5YWLh7S5xxq31j95HimH8bfAkaF-vQbM0w8HYM8FMAktpY4BH2fufl_N5M0I4-1G_1ed-DugIzh81Z58dz2q9KXYXrQWE_nEsyjKdNLcirR7fw8zEpkJNtVvms7iYwo-yjBdqdTJ6ngxFcOVS-3CSo0m7HTIjcXpIG3qQod8qOPGSyFxCbYFdr4jBFR7sGs6CSBhJYIbFBLk805EztJW_wmp3l3PNL6qvvI_gWALhV_-k8obxus3LAHETfRaI2QMtG5gFAnOvf_jIKUpvXCMm5pRwir83srw0tgpJRRUMmUllUlPVtR5Y7oosBOKqFbTj9-0oGyT_SxC1x66Cu53-K_0y0?></g></svg>